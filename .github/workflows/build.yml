name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_ID: cpa-opencode-go

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag and notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v0.1.0" >&2
            exit 1
          fi
          go run ./.github/scripts/release-notes \
            -notes RELEASE_NOTES.md \
            -tag "${GITHUB_REF_NAME}" \
            -out "${RUNNER_TEMP}/release-notes.md"
          test "$(head -n 1 "${RUNNER_TEMP}/release-notes.md")" = "# ${GITHUB_REF_NAME}"

      - name: Cache host integration dependencies
        run: go mod download all

      - name: Test with native host ABI coverage
        run: go test -tags debug ./...

      - name: Race detector
        run: go test -tags debug -race ./...

      - name: Test production build configuration
        run: go test ./...

      - name: Test release packaging
        run: go test ./.github/scripts/...

      - name: Vet
        run: go vet -tags debug ./... ./.github/scripts/...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X github.com/dillonzq/cpa-opencode-go/internal/plugin.pluginVersion=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${PLUGIN_ID}.h"

      - name: Package plugin
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-windows-arm64:
    name: Build windows/arm64
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_windows_arm64.zip" >> "${GITHUB_ENV}"

      - name: Build Windows ARM64 shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows-arm64
          output: ${{ env.PLUGIN_ID }}.dll
          flags: -ldflags=-s -w
          x-flags: github.com/dillonzq/cpa-opencode-go/internal/plugin.pluginVersion=${{ steps.release_metadata.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/windows-arm64/${PLUGIN_ID}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/windows-arm64/${PLUGIN_ID}.dll" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-freebsd:
    name: Build freebsd/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    env:
      FREEBSD_VERSION: '14.4'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            cc_arch: x86_64
            # From the release's amd64/amd64/14.4-RELEASE/MANIFEST.
            base_sha256: 769f60a6eea2938ad6b7943cfbcc17dfaf7d1f7ba59a32b869a00349302df853
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_freebsd_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Prepare FreeBSD cross-build sysroot
        timeout-minutes: 15
        env:
          FREEBSD_ARCH: ${{ matrix.goarch }}
          FREEBSD_BASE_SHA256: ${{ matrix.base_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          base_archive="${RUNNER_TEMP}/freebsd-base.txz"
          sysroot="${RUNNER_TEMP}/freebsd-sysroot"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --output "${base_archive}" \
            "https://download.freebsd.org/releases/${FREEBSD_ARCH}/${FREEBSD_ARCH}/${FREEBSD_VERSION}-RELEASE/base.txz"
          printf '%s  %s\n' "${FREEBSD_BASE_SHA256}" "${base_archive}" | sha256sum --check
          mkdir -p "${sysroot}"
          tar --extract --xz --file "${base_archive}" --directory "${sysroot}" \
            --no-same-owner ./usr/include ./usr/lib ./lib
          echo "FREEBSD_SYSROOT=${sysroot}" >> "${GITHUB_ENV}"

      - name: Build FreeBSD shared library
        timeout-minutes: 45
        env:
          CGO_ENABLED: '1'
          GOOS: freebsd
          GOARCH: ${{ matrix.goarch }}
          FREEBSD_CC_ARCH: ${{ matrix.cc_arch }}
          CGO_LDFLAGS: -fuse-ld=lld
        run: |
          set -euo pipefail
          export CC="clang --target=${FREEBSD_CC_ARCH}-unknown-freebsd${FREEBSD_VERSION} --sysroot=${FREEBSD_SYSROOT}"
          mkdir -p "dist/freebsd-${GOARCH}"
          go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X github.com/dillonzq/cpa-opencode-go/internal/plugin.pluginVersion=${VERSION}" \
            -o "dist/freebsd-${GOARCH}/${PLUGIN_ID}.so" .

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/freebsd-${{ matrix.goarch }}/${PLUGIN_ID}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/freebsd-${{ matrix.goarch }}/${PLUGIN_ID}.so" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Prepare release draft
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 7
          test "$(find dist -maxdepth 1 -name '*.sha256' | wc -l)" -eq 7
          sort dist/*.sha256 > dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)
          # RELEASE_NOTES.md is a changelog; the release body is only the section
          # for this tag, so older releases are not repeated here.
          go run ./.github/scripts/release-notes \
            -notes RELEASE_NOTES.md \
            -tag "${GITHUB_REF_NAME}" \
            -out "${RUNNER_TEMP}/release-notes.md"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "Refusing to replace assets of a published release" >&2
              exit 1
            fi
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
